name: Ubuntu entrypoint regression tests

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'scripts/lib/ubuntu_upgrade.sh'
      - 'scripts/lib/upgrade_resume.sh'
      - 'scripts/lib/state.sh'
      - 'tests/unit/test_ubuntu_upgrade*.py'
      - 'packages/manifest/**'
      - 'scripts/generated/internal_checksums.sh'
      - '.github/workflows/ubuntu-entrypoint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'install.sh'
      - 'scripts/lib/ubuntu_upgrade.sh'
      - 'scripts/lib/upgrade_resume.sh'
      - 'scripts/lib/state.sh'
      - 'tests/unit/test_ubuntu_upgrade*.py'
      - 'packages/manifest/**'
      - 'scripts/generated/internal_checksums.sh'
      - '.github/workflows/ubuntu-entrypoint.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - uses: ./.github/actions/setup-shellcheck
      - name: Check installer syntax and lint
        run: |
          bash -n install.sh
          shellcheck install.sh
      - name: Run host-safe upgrade regression tests against the full checkout
        run: |
          sudo python3 tests/unit/test_ubuntu_upgrade_entrypoint.py
      # PrivilegedCheckpointReadTests needs a disposable container as root, with
      # passwordless sudo for UID 1000 (the image's ubuntu user); it refuses the runner.
      - name: Run upgrade regression tests in a disposable container
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ubuntu:24.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq python3 jq sudo >/dev/null
            echo "ubuntu ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ubuntu
            chmod 0440 /etc/sudoers.d/ubuntu
            python3 tests/unit/test_ubuntu_upgrade_main.py
          '
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install manifest dependencies
        working-directory: packages/manifest
        run: bun install
      - name: Check canonical generated artifacts
        working-directory: packages/manifest
        run: bun run generate --diff
