name: Incus provider (stub incus)

# The fork's own workflow. It runs the Incus provider's fast tier, which
# tests scripts/providers/incus.sh, its host setup and its Tailscale
# sidecar against a stub incus, and machine.sh, the entry command in
# front of the launcher, against a stub launcher, and its verify checks
# against stub agents, services and transports. Upstream's
# installer.yml runs each tests/unit script by name, so a new one needs
# its own job.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/providers/incus*.sh'
      - 'scripts/providers/machine*.sh'
      - 'scripts/lib/logging.sh'
      - 'tests/unit/test_incus_*.sh'
      - 'tests/unit/fixtures/incus/**'
      - '.github/workflows/incus-provider.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/providers/incus*.sh'
      - 'scripts/providers/machine*.sh'
      - 'scripts/lib/logging.sh'
      - 'tests/unit/test_incus_*.sh'
      - 'tests/unit/fixtures/incus/**'
      - '.github/workflows/incus-provider.yml'

permissions:
  contents: read

jobs:
  stub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Launcher against a stub incus
        run: HOME="$(mktemp -d)" bash tests/unit/test_incus_provider_stub.sh
      - name: Host setup against a stub incus
        run: HOME="$(mktemp -d)" bash tests/unit/test_incus_host_setup.sh
      - name: Tailscale sidecar against a stub incus
        run: HOME="$(mktemp -d)" bash tests/unit/test_incus_tailscale.sh
      - name: Entry command against a stub launcher
        run: HOME="$(mktemp -d)" bash tests/unit/test_incus_machine.sh
      - name: Machine verify against stub agents, services, incus and ssh
        run: HOME="$(mktemp -d)" bash tests/unit/test_incus_machine_verify.sh
