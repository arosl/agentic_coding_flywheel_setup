name: Incus provider (stub incus)

# The fork's own workflow. It runs the launcher's fast tier, which tests
# scripts/providers/incus.sh against a stub incus. Upstream's installer.yml
# runs each tests/unit script by name, so a new one needs its own job.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/providers/incus.sh'
      - 'scripts/lib/logging.sh'
      - 'tests/unit/test_incus_provider_stub.sh'
      - 'tests/unit/fixtures/incus/**'
      - '.github/workflows/incus-provider.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/providers/incus.sh'
      - 'scripts/lib/logging.sh'
      - 'tests/unit/test_incus_provider_stub.sh'
      - 'tests/unit/fixtures/incus/**'
      - '.github/workflows/incus-provider.yml'

permissions:
  contents: read

jobs:
  stub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Launcher against a stub incus
        run: HOME="$(mktemp -d)" bash tests/unit/test_incus_provider_stub.sh
