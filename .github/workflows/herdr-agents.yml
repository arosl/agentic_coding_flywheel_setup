name: herdr agents (stub herdr)

# The fork's own workflow. It runs scripts/lib/herdr_agents.sh (acfs agents
# spawn/send/list) against a stub herdr and a stub am, and the Agent Mail
# Stop hook (scripts/lib/agent_mail_hook.sh), nhm's hook lines
# (scripts/lib/nhm_hooks.sh, with doctor's and acfs update's nhm steps) and the quota reader
# (scripts/lib/agent_quota.sh) the same way, the temp sweep
# (scripts/lib/temp_sweep.sh) against a fixture temp dir, and the gate runner
# (scripts/tests/run_gate.sh) against a stub checkout, and doctor's
# container section against stub
# systemd, incus and state layer. The check-generated job runs the
# generated-file pre-commit check (scripts/hooks/check_generated.sh)
# against fixture repos and the real generator. Upstream's
# installer.yml runs each tests/unit script by name, so a new one needs its
# own job.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/herdr_agents.sh'
      - 'scripts/lib/doctor.sh'
      - 'tests/unit/test_herdr_agents.sh'
      - 'tests/unit/test_doctor_codex_daemon.sh'
      - 'tests/unit/test_doctor_herdr.sh'
      - 'scripts/lib/agent_mail_hook.sh'
      - 'tests/unit/test_agent_mail_hook.sh'
      - 'tests/unit/test_doctor_agent_mail_hook.sh'
      - 'scripts/lib/nhm_hooks.sh'
      - 'scripts/lib/update.sh'
      - 'tests/unit/test_nhm_hooks.sh'
      - 'tests/unit/test_doctor_nhm.sh'
      - 'tests/unit/test_update_nhm.sh'
      - 'tests/unit/test_nhm_plugin_bind.sh'
      - 'tests/unit/test_nhm_takeover.sh'
      - 'install.sh'
      - 'tests/unit/test_nhm_bin_dir_unset.sh'
      - 'scripts/lib/agent_quota.sh'
      - 'tests/unit/test_agent_quota.sh'
      - 'tests/unit/test_doctor_agents_route.sh'
      - 'tests/unit/test_doctor_host_capacity.sh'
      - 'scripts/lib/temp_sweep.sh'
      - 'tests/unit/test_temp_sweep.sh'
      - 'scripts/tests/run_gate.sh'
      - 'tests/unit/test_run_gate.sh'
      - 'scripts/tests/ensure_playwright_browsers.sh'
      - 'tests/unit/test_ensure_playwright_browsers.sh'
      - 'tests/unit/test_doctor_container.sh'
      - 'scripts/hooks/check_generated.sh'
      - 'tests/unit/test_check_generated.sh'
      - '.github/workflows/herdr-agents.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/herdr_agents.sh'
      - 'scripts/lib/doctor.sh'
      - 'tests/unit/test_herdr_agents.sh'
      - 'tests/unit/test_doctor_codex_daemon.sh'
      - 'tests/unit/test_doctor_herdr.sh'
      - 'scripts/lib/agent_mail_hook.sh'
      - 'tests/unit/test_agent_mail_hook.sh'
      - 'tests/unit/test_doctor_agent_mail_hook.sh'
      - 'scripts/lib/nhm_hooks.sh'
      - 'scripts/lib/update.sh'
      - 'tests/unit/test_nhm_hooks.sh'
      - 'tests/unit/test_doctor_nhm.sh'
      - 'tests/unit/test_update_nhm.sh'
      - 'tests/unit/test_nhm_plugin_bind.sh'
      - 'tests/unit/test_nhm_takeover.sh'
      - 'install.sh'
      - 'tests/unit/test_nhm_bin_dir_unset.sh'
      - 'scripts/lib/agent_quota.sh'
      - 'tests/unit/test_agent_quota.sh'
      - 'tests/unit/test_doctor_agents_route.sh'
      - 'tests/unit/test_doctor_host_capacity.sh'
      - 'scripts/lib/temp_sweep.sh'
      - 'tests/unit/test_temp_sweep.sh'
      - 'scripts/tests/run_gate.sh'
      - 'tests/unit/test_run_gate.sh'
      - 'scripts/tests/ensure_playwright_browsers.sh'
      - 'tests/unit/test_ensure_playwright_browsers.sh'
      - 'tests/unit/test_doctor_container.sh'
      - 'scripts/hooks/check_generated.sh'
      - 'tests/unit/test_check_generated.sh'
      - '.github/workflows/herdr-agents.yml'

permissions:
  contents: read

jobs:
  stub:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Agent helper against a stub herdr
        run: HOME="$(mktemp -d)" bash tests/unit/test_herdr_agents.sh
      - name: Doctor's Codex daemon check against a stub helper
        run: HOME="$(mktemp -d)" bash tests/unit/test_doctor_codex_daemon.sh
      - name: Doctor's herdr server and integration checks against a stub herdr
        run: HOME="$(mktemp -d)" bash tests/unit/test_doctor_herdr.sh
      - name: Agent Mail Stop hook against a stub am and herdr
        run: HOME="$(mktemp -d)" bash tests/unit/test_agent_mail_hook.sh
      - name: Doctor's Agent Mail Stop hook check against fixture settings
        run: HOME="$(mktemp -d)" bash tests/unit/test_doctor_agent_mail_hook.sh
      - name: nhm hook lines against fixture settings
        run: HOME="$(mktemp -d)" bash tests/unit/test_nhm_hooks.sh
      - name: Doctor's nhm check against fixture homes
        run: HOME="$(mktemp -d)" bash tests/unit/test_doctor_nhm.sh
      - name: acfs update's nhm install and hook lines against stubs
        run: HOME="$(mktemp -d)" bash tests/unit/test_update_nhm.sh
      - name: nhm's herdr plugin and keys (opt-out, bind order) against a fake herdr and nhm
        run: HOME="$(mktemp -d)" bash tests/unit/test_nhm_plugin_bind.sh
      - name: nhm's takeover of the herdr server (install, update, doctor) against a fake nhm
        run: HOME="$(mktemp -d)" bash tests/unit/test_nhm_takeover.sh
      - name: install.sh and acfs update ignore a caller's NHM_BIN_DIR
        run: bash tests/unit/test_nhm_bin_dir_unset.sh
      - name: Quota reader against fixture session logs
        run: HOME="$(mktemp -d)" bash tests/unit/test_agent_quota.sh
      - name: acfs agents routing in doctor.sh against a stub helper
        run: HOME="$(mktemp -d)" bash tests/unit/test_doctor_agents_route.sh
      - name: Doctor's host capacity checks against a stub capacity.sh
        run: HOME="$(mktemp -d)" bash tests/unit/test_doctor_host_capacity.sh
      - name: Temp sweep against a fixture temp dir
        run: HOME="$(mktemp -d)" bash tests/unit/test_temp_sweep.sh
      - name: Gate runner against a stub checkout
        run: HOME="$(mktemp -d)" bash tests/unit/test_run_gate.sh
      - name: Gate's Playwright browsers from a zip mirror, against a fake CLI
        run: HOME="$(mktemp -d)" bash tests/unit/test_ensure_playwright_browsers.sh
      - name: Doctor's container section against stub systemd, incus and state layer
        run: HOME="$(mktemp -d)" bash tests/unit/test_doctor_container.sh

  check-generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install the manifest generator's dependencies
        run: bun install --frozen-lockfile --filter '@acfs/manifest'
      - name: Generated-file check against fixture repos and the real generator
        run: HOME="$(mktemp -d)" bash tests/unit/test_check_generated.sh
