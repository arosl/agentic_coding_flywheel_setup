name: Set up ShellCheck
description: >-
  Install the ShellCheck release CI is pinned to, from koalaman/shellcheck's
  GitHub release, checked against its SHA-256, and put it first on PATH.
  Bumping the version is a gate change: fix or suppress its new findings in
  the same commit.
runs:
  using: composite
  steps:
    - name: Install ShellCheck 0.9.0
      shell: bash
      env:
        SHELLCHECK_VERSION: '0.9.0'
      run: |
        set -euo pipefail
        # SHA-256 of each release tarball, computed from the release download on 2026-10-09.
        case "$(uname -m)" in
          x86_64)
            arch=x86_64
            sha256=700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f
            ;;
          aarch64)
            arch=aarch64
            sha256=179c579ef3481317d130adebede74a34dbbc2df961a70916dd4039ebf0735fae
            ;;
          *)
            echo "No pinned ShellCheck build for $(uname -m)" >&2
            exit 1
            ;;
        esac
        tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
        curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
          "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
        echo "${sha256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
        tar -xJf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}"
        echo "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
        "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --version
