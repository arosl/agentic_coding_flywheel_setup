  - id: b-mwcd6dhg-m74f4i
    content: After an upstream ACFS sync, grep new scripts/swarm-fleet-*.py for
      'st_mode & 0o022' and port the fork's private-group writable_by_others;
      each fleet script carries its own copy because remote receivers run the
      file alone. Prove it with an unpatched 0775 dir chain, not just a mocked
      private_group.
