  - id: b-mwcd6dhg-z3j0bz
    content: "To commit a file holding another agent's uncommitted lines, use a
      temporary index: GIT_INDEX_FILE=$t git read-tree HEAD; update-index
      --cacheinfo with your hash-object -w blob; GIT_INDEX_FILE=$t bash
      scripts/hooks/check_generated.sh --regenerate (since f3d99ea6 it stages
      into $t); GIT_INDEX_FILE=$t git commit; then git restore --staged your
      paths so the shared index matches HEAD."
    category: general
